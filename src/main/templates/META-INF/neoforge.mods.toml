license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Piotrek"
description='''Adds smooth railroad curves and parallel siding switches for Minecraft minecarts.'''
logoFile="assets/peterwolfs_railroads_one/icon.png"

[[mixins]]
config="peterwolfs_railroads_one.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecart_chain"
type="required"
versionRange="[1.0.28,)"
ordering="AFTER"
side="BOTH"
